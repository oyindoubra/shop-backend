<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Commerce Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <span class="text-xl font-extrabold text-slate-900 tracking-tight">AURA<span class="text-indigo-600">.SHOP</span></span>
      </div>

      <!-- Actions -->
      <div class="flex items-center space-x-4">
        <!-- Google Auth Container -->
        <div id="g_id_onload"
             data-client_id=1061855546775-5iumod74oevfifuoqdp11eocm5cq3rj5.apps.googleusercontent.com
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill"></div>

        <div id="user-profile" class="hidden flex items-center space-x-2 bg-slate-100 p-1.5 rounded-full pr-3">
          <img id="user-avatar" class="w-8 h-8 rounded-full border border-indigo-200" src="" alt="User" />
          <span id="user-name" class="text-xs font-semibold text-slate-700"></span>
        </div>

        <!-- Cart Button -->
        <button onclick="toggleCart()" class="relative bg-slate-100 hover:bg-slate-200 p-2.5 rounded-full text-slate-700 transition">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-gradient-to-r from-indigo-900 to-slate-900 text-white py-12 px-4 text-center">
    <h1 class="text-3xl md:text-5xl font-extrabold mb-3">Elevate Your Everyday Essentials</h1>
    <p class="text-indigo-200 text-sm md:text-base max-w-2xl mx-auto">Discover premium products backed by seamless Google Authentication, Supabase data persistence, and Mailgun email receipts.</p>
  </section>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- Controls Bar -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
      <div class="flex flex-wrap gap-2" id="category-filters">
        <button onclick="filterCategory('All')" class="cat-btn active bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-medium">All Products</button>
        <button onclick="filterCategory('Electronics')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-100">Electronics</button>
        <button onclick="filterCategory('Accessories')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-100">Accessories</button>
        <button onclick="filterCategory('Home & Living')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-100">Home & Living</button>
      </div>

      <div class="relative w-full md:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="Search products..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading State -->
      <div class="col-span-full text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
        <p>Loading catalog from server...</p>
      </div>
    </div>
  </main>

  <!-- Cart Drawer Overlay -->
  <div id="cart-drawer" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden transition-opacity">
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-indigo-600"></i> Your Shopping Cart</h2>
        <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <!-- Items List -->
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
        <p class="text-center text-slate-400 py-8">Your cart is empty</p>
      </div>

      <!-- Cart Footer & Checkout Form -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
        <div class="flex justify-between font-bold text-slate-800 text-lg">
          <span>Subtotal:</span>
          <span id="cart-total">$0.00</span>
        </div>

        <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-3 pt-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Customer Email (Receives Mailgun Email)</label>
            <input type="email" id="checkout-email" required placeholder="name@domain.com" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Shipping Address</label>
            <input type="text" id="checkout-address" required placeholder="Street, City, Country" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500" value="123 Innovation Drive, Lagos" />
          </div>
          <button type="submit" id="checkout-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-indigo-200 transition flex justify-center items-center gap-2">
            <span>Complete Order & Send Receipt</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Dynamically select host URL (works locally & live on Vercel)
    const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000' 
      : window.location.origin;

    let products = [];
    let cart = [];
    let currentUser = null;

    // Load Catalog
    async function loadProducts() {
      try {
        const res = await fetch(`${API_URL}/api/products`);
        products = await res.json();
        renderProducts(products);
      } catch (err) {
        document.getElementById('product-grid').innerHTML = `
          <div class="col-span-full bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg text-center">
            Backend server not responding. Please make sure <code>node server.js</code> is running.
          </div>`;
      }
    }

    function renderProducts(items) {
      const container = document.getElementById('product-grid');
      container.innerHTML = items.map(p => `
        <div class="bg-white border border-slate-100 rounded-xl shadow-sm hover:shadow-md transition overflow-hidden flex flex-col">
          <img src="${p.image_url || 'https://via.placeholder.com/300'}" alt="${p.name}" class="h-48 w-full object-cover" />
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">${p.category}</span>
              <h3 class="font-bold text-slate-800 text-lg mt-1">${p.name}</h3>
            </div>
            <div class="mt-4 flex items-center justify-between">
              <span class="text-xl font-extrabold text-slate-900">$${parseFloat(p.price).toFixed(2)}</span>
              <button onclick="addToCart('${p.id}')" class="bg-slate-900 hover:bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Add
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Cart Operations
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if(!product) return;
      const existing = cart.find(item => item.id === id);
      if(existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      toggleCart(true);
    }

    function updateCartUI() {
      const badge = document.getElementById('cart-badge');
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      const count = cart.reduce((acc, i) => acc + i.qty, 0);
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

      badge.textContent = count;
      totalEl.textContent = `$${total.toFixed(2)}`;

      if(cart.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-8">Your cart is empty</p>`;
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-100">
          <div>
            <h4 class="font-bold text-sm text-slate-800">${item.name}</h4>
            <span class="text-xs text-slate-500">$${item.price} × ${item.qty}</span>
          </div>
          <span class="font-bold text-indigo-600 text-sm">$${(item.price * item.qty).toFixed(2)}</span>
        </div>
      `).join('');
    }

    function toggleCart(forceOpen = false) {
      const drawer = document.getElementById('cart-drawer');
      if(forceOpen) {
        drawer.classList.remove('hidden');
      } else {
        drawer.classList.toggle('hidden');
      }
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-white', 'text-slate-600');
      });
      event.target.classList.add('bg-indigo-600', 'text-white');
      
      if(cat === 'All') renderProducts(products);
      else renderProducts(products.filter(p => p.category === cat));
    }

    function searchProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      renderProducts(products.filter(p => p.name.toLowerCase().includes(query)));
    }

    // Google OAuth Handler
    function handleCredentialResponse(response) {
      fetch(`${API_URL}/api/auth/google`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential })
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          currentUser = data.user;
          document.getElementById('checkout-email').value = currentUser.email;
          document.getElementById('user-name').textContent = currentUser.name;
          document.getElementById('user-avatar').src = currentUser.picture;
          document.getElementById('user-profile').classList.remove('hidden');
          document.querySelector('.g_id_signin').classList.add('hidden');
        }
      });
    }

    // Checkout Submit
    async function handleCheckout(e) {
      e.preventDefault();
      if(cart.length === 0) return alert('Please add items to your cart first!');

      const btn = document.getElementById('checkout-btn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing Order...`;

      const email = document.getElementById('checkout-email').value;
      const address = document.getElementById('checkout-address').value;
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

      try {
        const res = await fetch(`${API_URL}/api/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_email: email,
            items: cart,
            total_amount: total,
            shipping_address: { street: address }
          })
        });

        const data = await res.json();
        if(data.success) {
          alert(`🎉 Order Completed!\n\nOrder ID: ${data.orderId}\n\nA confirmation email has been dispatched via Mailgun to ${email}.`);
          cart = [];
          updateCartUI();
          toggleCart(false);
        } else {
          alert('Error placing order: ' + data.error);
        }
      } catch(err) {
        alert('Server request failed.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Complete Order & Send Receipt</span> <i class="fa-solid fa-paper-plane"></i>`;
      }
    }

    // Initialize
    loadProducts();
  </script>
</body>
</html>
